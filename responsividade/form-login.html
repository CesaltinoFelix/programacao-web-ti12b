<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resposividade</title>
    <style>
      * {
        padding: 0px;
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: space-between;
        align-items: center;
        overflow: hidden;
      }

      input {
        width: 200px;
        height: 40px;
        border: 2px dashed #000;
        padding: 10px;
      }

      button {
        width: 200px;
        height: 40px;
        border: none;
        background-color: #000;
        padding: 10px;
        color: #fff;
      }

      /* @media screen and (max-width: 720px)

      { */
      #login{
        width: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 5px;
         animation: show 2s ease-in-out; 
      }
      /* } */

       @keyframes show {
        0% {
          opacity: 0;
          transform: translate(170px, 100px);
        }

        50%{
             transform: translate( 170px, 0);
        }

        100% {
          opacity: 1;
          transform: translate(0, 0);
        }
      } 

      div {
        height: 100vh;
        width: 50%;
        background-color: #000;
        animation: show2 1s ease-in 1s forwards;
          transform: translateX(100%);

      }

      @keyframes show2 {
         0% {
          transform: translateX(100%);
          display: block;
        }

         100% {
          transform: translateX(0%);
        }
      }
    </style>
  </head>
  <body>
    <section id="login">
      <form action="">
        <input type="email" name="" id="" placeholder="Email" />
        <input type="password" name="" id="" placeholder="password" />
        <button>Entrar</button>
      </form>
    </section>

    <div></div>
  </body>
</html>
